# Extent Reports Configuration for SCRUM-184 Tests

extent.reporter.spark.start=true
extent.reporter.spark.out=target/cucumber-reports/ExtentReport.html
extent.reporter.spark.config=src/test/resources/extent-config.xml

# Report Theme: standard or dark
extent.reporter.spark.theme=standard

# Document Encoding
extent.reporter.spark.encoding=UTF-8

# Enable Offline Mode (no CDN dependencies)
extent.reporter.spark.offline=true

# Screenshot Relative Path
screenshot.dir=../screenshots/
screenshot.rel.path=../screenshots/

# Report Title and Name
extent.reporter.spark.vieworder=dashboard,test,category,exception,author,device,log

# System Information
systeminfo.os=OS Name - ${os.name}
systeminfo.java=Java Version - ${java.version}
systeminfo.browser=Chrome
systeminfo.environment=Test
systeminfo.project=SCRUM-184 User Authentication Tests
systeminfo.testcase=TC-SCRUM-183-001
