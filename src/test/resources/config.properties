# ParaBank Application Configuration
# Base URL for ParaBank application
base.url=https://parabank.parasoft.com/parabank/index.htm

# Browser Configuration
# Supported browsers: chrome, firefox, edge, safari
browser=chrome

# Browser settings
browser.headless=false
browser.maximize=true
implicit.wait=10
explicit.wait=20
page.load.timeout=30

# Test Data Configuration
test.data.folder=src/test/resources/testdata

# Screenshot Configuration
screenshot.on.failure=true
screenshot.folder=test-output/screenshots

# Report Configuration
report.folder=test-output/reports
extent.report.name=ParaBank Test Execution Report

# Logging Configuration
log.level=INFO
