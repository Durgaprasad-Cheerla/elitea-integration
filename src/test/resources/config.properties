# Application Configuration
app.url=https://onlineaccess.edwardjones.com/app/oa-login
app.title=Welcome to Online Access

# Browser Configuration
browser=chrome
headless=false

# WebDriver Timeouts (in seconds)
implicit.wait=10
explicit.wait=10
page.load.timeout=30

# Test Data for SCRUM-191
invalid.userId=InvalidUser999
invalid.password=WrongPass123

# Expected Error Messages (for validation)
expected.error.generic=Invalid User ID or Password
expected.error.alternative=The credentials you entered are incorrect

# Screenshot Configuration
screenshot.on.failure=true
screenshot.location=target/screenshots

# Reporting
report.output.path=target/cucumber-reports
