# Application Configuration
app.base.url=https://www.edwardjones.com
app.login.url=https://www.edwardjones.com/login
app.dashboard.url=https://www.edwardjones.com/dashboard

# Browser Configuration
browser.type=chrome
browser.headless=false
browser.window.maximize=true
implicit.wait.seconds=10
explicit.wait.seconds=20
page.load.timeout.seconds=30

# Test Data - Valid User Credentials
test.user.username=testuser001
test.user.password=ValidPass123!
test.user2.username=testuser002
test.user2.password=SecurePass456!
test.user3.username=testuser003
test.user3.password=StrongPass789!

# Performance Thresholds
performance.authentication.max.seconds=3
performance.page.load.max.seconds=5

# Security Configuration
security.verify.https=true
security.verify.password.masking=true
security.verify.session.token=true

# Reporting Configuration
report.output.directory=target/cucumber-reports
screenshot.on.failure=true
screenshot.directory=target/screenshots

# Logging Configuration
log.level=INFO
log.file.path=target/logs/automation.log
